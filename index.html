<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101626"><title>RestoPilot — Restaurant OS</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:245px;background:#10182a;border-right:1px solid #25304a;padding:26px 16px;overflow:auto}.logo{font-size:24px;font-weight:850;letter-spacing:-1px;margin:0 12px 34px}.logo span{color:#8c7cff}.nav{display:block;width:100%;padding:13px 16px;text-align:left;border:0;background:transparent;color:#9eabc3;border-radius:11px;margin:4px 0}.nav.active,.nav:hover{background:#27284f;color:#fff}.sidefoot{margin-top:40px;color:#8b9ab4;font-size:12px;padding:14px}main{margin-left:245px;padding:30px 36px;max-width:1750px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}.muted{color:#94a3bb}.top h1{font-size:28px;margin:0 0 6px}.top p{margin:0}.pill{border:1px solid #2c3851;border-radius:100px;padding:9px 14px;color:#b4c2d9}.btn{background:#8069f2;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:650}.btn.secondary{background:#25314a}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:#151f33;border:1px solid #27334c;border-radius:17px;padding:20px}.card .number{font-size:29px;font-weight:800;margin:14px 0 7px}.card small{color:#a1b0ca}.panel{margin-top:18px}.panel h3{margin:0 0 17px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px 12px;border-bottom:1px solid #29364d;white-space:nowrap}th{color:#a4b1c7;font-weight:500;font-size:13px}td{font-size:14px}.tag{padding:5px 9px;border-radius:20px;background:#2d3750;color:#d7e0f2;font-size:12px}.tag.ready,.tag.available,.tag.paid{background:#164a3e;color:#7de6b8}.tag.preparing,.tag.reserved{background:#514021;color:#ffd67c}.tag.new,.tag.occupied{background:#453052;color:#e5afff}.actions{display:flex;gap:8px;align-items:center}input,select{background:#0f1728;border:1px solid #35425c;border-radius:10px;padding:11px;color:white;min-width:0}input:focus,select:focus{outline:2px solid #8069f2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.item{background:#1b2940;padding:18px;border-radius:14px;border:1px solid #32415b}.item strong{display:block;margin-bottom:10px}.item p{color:#9aabc3;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:10}.dialog{background:#1a263b;padding:25px;border:1px solid #45526a;border-radius:18px;width:min(460px,100%);max-height:90vh;overflow:auto}.field{display:grid;gap:7px;margin:12px 0}.field label{color:#b3c2d7;font-size:13px}.field input,.field select{width:100%}.toast{position:fixed;bottom:24px;right:24px;background:#254d40;color:#d2ffeb;padding:14px 20px;border-radius:12px;z-index:20}.mobilehead{display:none}canvas{max-height:285px}body.light{background:#f3f6fc;color:#18243a}body.light aside,body.light .card,body.light .panel,body.light .dialog{background:#fff;color:#18243a;border-color:#dce3ee}body.light .item{background:#f4f6fb;color:#18243a}body.light input,body.light select{background:#f4f6fc;color:#18243a;border-color:#cbd5e1}body.light th,body.light td{border-color:#e2e8f0}body.light .nav{color:#46546a}body.light .nav.active{background:#eeeaff;color:#5c43c8}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:720px){aside{transform:translateX(-100%);transition:.2s;z-index:5}aside.open{transform:none}main{margin:0;padding:18px}.mobilehead{display:flex;justify-content:space-between;margin-bottom:22px}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.card .number{font-size:23px}.top{align-items:flex-start}.pill{display:none}}@media(max-width:420px){.cards{grid-template-columns:1fr}}
</style></head><body><aside id="sidebar"><div class="logo">✦ Resto<span>Pilot</span></div><nav id="nav"></nav><div class="sidefoot">DEMO MODE · Browser-only data<br><br>RestoPilot v1.0</div></aside><main><div class="mobilehead"><button class="btn secondary" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button><strong>RestoPilot</strong></div><header class="top"><div><h1 id="heading">Overview</h1><p class="muted" id="subtitle">Your restaurant at a glance</p></div><div class="row"><span class="pill">● Demo Restaurant</span><button class="btn secondary" onclick="toggleTheme()">☼ Theme</button><button class="btn" onclick="openAdd()">+ Add new</button></div></header><section id="content"></section></main><div id="modal" class="modal hidden"><div class="dialog"><div class="row"><h2 id="modalTitle">Add</h2><button class="btn secondary" onclick="closeModal()">✕</button></div><form id="entryForm"></form></div></div><div id="toast" class="toast hidden"></div><script>
const pages=[['overview','◫','Overview'],['orders','▤','Orders'],['tables','▦','Tables'],['menu','☷','Menu Management'],['reservations','▣','Reservations'],['inventory','◈','Inventory'],['customers','♙','Customers'],['analytics','◴','Analytics'],['staff','♧','Staff'],['settings','⚙','Settings']];
const seed={orders:[{id:1001,customer:'Sofia Martin',item:'Truffle Pasta',amount:145,status:'new',date:'2026-11-18'},{id:1002,customer:'Adam Benali',item:'Margherita Pizza',amount:95,status:'preparing',date:'2026-11-18'},{id:1003,customer:'Lina Ahmed',item:'Salmon Bowl',amount:165,status:'ready',date:'2026-11-18'},{id:1004,customer:'Omar Said',item:'Classic Burger',amount:110,status:'paid',date:'2026-11-17'}],tables:Array.from({length:12},(_,i)=>({id:i+1,seats:i%3===0?6:4,status:i%4===0?'occupied':i%4===1?'reserved':'available'})),menu:[{id:1,name:'Truffle Pasta',category:'Main Course',price:145},{id:2,name:'Margherita Pizza',category:'Pizza',price:95},{id:3,name:'Salmon Bowl',category:'Main Course',price:165},{id:4,name:'Classic Burger',category:'Burger',price:110},{id:5,name:'Tiramisu',category:'Dessert',price:65}],reservations:[{id:1,customer:'Nora Karim',date:'2026-11-19',time:'19:30',guests:4,status:'confirmed'},{id:2,customer:'Yassine Ali',date:'2026-11-20',time:'20:00',guests:2,status:'confirmed'}],inventory:[{id:1,name:'Tomatoes',quantity:24,unit:'kg',min:10},{id:2,name:'Mozzarella',quantity:4,unit:'kg',min:8},{id:3,name:'Flour',quantity:45,unit:'kg',min:15},{id:4,name:'Salmon',quantity:3,unit:'kg',min:5}],customers:[{id:1,name:'Sofia Martin',email:'sofia@example.com',visits:8},{id:2,name:'Adam Benali',email:'adam@example.com',visits:4},{id:3,name:'Lina Ahmed',email:'lina@example.com',visits:11}],staff:[{id:1,name:'Amine',role:'Manager',shift:'Morning'},{id:2,name:'Sara',role:'Chef',shift:'Evening'},{id:3,name:'Younes',role:'Waiter',shift:'Morning'}],settings:{restaurant:'Maison Resto',currency:'MAD'}};
let db;try{db=JSON.parse(localStorage.getItem('restopilot-demo-v1'))||structuredClone(seed)}catch(e){db=structuredClone(seed)}for(const k of Object.keys(seed))if(!(k in db))db[k]=structuredClone(seed[k]);let page='overview',chart;
const save=()=>localStorage.setItem('restopilot-demo-v1',JSON.stringify(db)),money=n=>Number(n||0).toLocaleString('fr-MA')+' '+db.settings.currency,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),status=s=>'<span class="tag '+esc(s)+'">'+esc(s)+'</span>';
function notify(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2400)}
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');render()}
function nav(){document.getElementById('nav').innerHTML=pages.map(([id,ic,label])=>'<button class="nav '+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+ic+' &nbsp; '+label+'</button>').join('')}
function card(t,v,s){return '<div class="card"><small>'+t+'</small><div class="number">'+v+'</div><small>'+s+'</small></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function row(cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
function actions(k,id){return '<div class="actions"><button class="btn secondary" onclick="edit(\''+k+'\','+id+')">Edit</button><button class="btn secondary" onclick="remove(\''+k+'\','+id+')">Delete</button></div>'}
function selectStatus(k,id,value,options){return '<select aria-label="Change status" onchange="changeStatus(\''+k+'\','+id+',this.value)">'+options.map(s=>'<option '+(s===value?'selected':'')+'>'+s+'</option>').join('')+'</select>'}
function render(){nav();let title=pages.find(p=>p[0]===page)[2];document.getElementById('heading').textContent=title;document.getElementById('subtitle').textContent=page==='overview'?'Welcome back! Here is what is happening at your restaurant.':'Manage your '+title.toLowerCase()+' in one place.';let html='';
const paid=db.orders.filter(o=>o.status==='paid'),revenue=paid.reduce((a,o)=>a+Number(o.amount),0),low=db.inventory.filter(i=>Number(i.quantity)<=Number(i.min)).length;
if(page==='overview'){html='<div class="cards">'+card('Total revenue',money(revenue),'Paid demo orders')+card('Total orders',db.orders.length,'Across all statuses')+card('Active reservations',db.reservations.length,'Upcoming bookings')+card('Low stock alerts',low,'Ingredients to restock')+'</div><div class="two"><div class="panel"><h3>Revenue overview</h3><canvas id="salesChart"></canvas></div><div class="panel"><h3>Quick insights</h3><p>🍽️ '+db.tables.filter(t=>t.status==='occupied').length+' occupied tables</p><p>⏳ '+db.orders.filter(o=>o.status==='preparing').length+' preparing orders</p><p>⚠️ '+low+' low-stock ingredients</p><p>👥 '+db.customers.length+' customer profiles</p></div></div><div class="panel"><h3>Recent orders</h3>'+orderTable(db.orders.slice(0,5))+'</div>'}
if(page==='orders')html='<div class="panel"><div class="row"><h3>All orders ('+db.orders.length+')</h3><button class="btn secondary" onclick="exportCSV(\'orders\')">Export CSV</button></div>'+orderTable(db.orders)+'</div>';
if(page==='tables')html='<div class="panel"><h3>Floor & table status</h3><div class="grid">'+db.tables.map(t=>'<div class="item"><strong>Table '+t.id+'</strong><p>'+t.seats+' seats</p>'+status(t.status)+'<div style="margin-top:12px">'+selectStatus('tables',t.id,t.status,['available','occupied','reserved'])+'</div></div>').join('')+'</div></div>';
if(page==='menu')html='<div class="panel"><div class="row"><h3>Menu items</h3><button class="btn secondary" onclick="exportCSV(\'menu\')">Export CSV</button></div><div class="grid">'+db.menu.map(i=>'<div class="item"><strong>'+esc(i.name)+'</strong><p>'+esc(i.category)+'</p><h3>'+money(i.price)+'</h3>'+actions('menu',i.id)+'</div>').join('')+'</div></div>';
if(page==='reservations')html='<div class="panel"><h3>Upcoming reservations</h3>'+table(['Guest','Date','Time','Guests','Status','Actions'],db.reservations.map(i=>row([esc(i.customer),esc(i.date),esc(i.time),i.guests,status(i.status),actions('reservations',i.id)])))+'</div>';
if(page==='inventory')html='<div class="panel"><h3>Inventory & stock alerts</h3>'+table(['Ingredient','Quantity','Minimum','Status','Actions'],db.inventory.map(i=>row([esc(i.name),esc(i.quantity)+' '+esc(i.unit),esc(i.min)+' '+esc(i.unit),Number(i.quantity)<=Number(i.min)?status('low stock'):status('healthy'),actions('inventory',i.id)])))+'</div>';
if(page==='customers')html='<div class="panel"><h3>Customer directory</h3>'+table(['Name','Email','Visits','Actions'],db.customers.map(i=>row([esc(i.name),esc(i.email),i.visits,actions('customers',i.id)])))+'</div>';
if(page==='staff')html='<div class="panel"><h3>Team directory</h3>'+table(['Name','Role','Shift','Actions'],db.staff.map(i=>row([esc(i.name),esc(i.role),esc(i.shift),actions('staff',i.id)])))+'</div>';
if(page==='analytics')html='<div class="cards">'+card('Revenue',money(revenue),'Paid orders')+card('Average order',money(db.orders.length?db.orders.reduce((a,o)=>a+Number(o.amount),0)/db.orders.length:0),'All orders')+card('Reservations',db.reservations.length,'Bookings')+card('Menu products',db.menu.length,'Available dishes')+'</div><div class="two"><div class="panel"><h3>Sales performance (demo)</h3><canvas id="salesChart"></canvas></div><div class="panel"><h3>Order status mix</h3><canvas id="statusChart"></canvas></div></div>';
if(page==='settings')html='<div class="panel"><h3>Restaurant preferences</h3><form onsubmit="saveSettings(event)"><div class="field"><label>Restaurant name</label><input name="restaurant" required value="'+esc(db.settings.restaurant)+'"></div><div class="field"><label>Currency</label><select name="currency">'+['MAD','EUR','USD'].map(c=>'<option '+(db.settings.currency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><button class="btn">Save settings</button></form></div><div class="panel"><h3>Demo data</h3><p class="muted">All changes are saved only in this browser. No accounts, payments or backend.</p><button class="btn secondary" onclick="resetDemo()">Reset demo data</button></div>';
document.getElementById('content').innerHTML=html;if(chart){chart.destroy();chart=null}if(['overview','analytics'].includes(page))drawCharts()}
function orderTable(data){return table(['Order','Customer','Item','Amount','Status','Date','Actions'],data.map(i=>row(['#'+i.id,esc(i.customer),esc(i.item),money(i.amount),selectStatus('orders',i.id,i.status,['new','preparing','ready','paid']),esc(i.date),actions('orders',i.id)])))}
function drawCharts(){if(typeof Chart==='undefined')return;const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a9b6ce'}}},scales:{x:{ticks:{color:'#9caac3'},grid:{color:'#28344b'}},y:{ticks:{color:'#9caac3'},grid:{color:'#28344b'},beginAtZero:true}}};let c=document.getElementById('salesChart');if(c)chart=new Chart(c,{type:'bar',data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{label:'Illustrative revenue (MAD)',data:[1240,1830,1550,2200,1940,2840,2460],backgroundColor:'#8875f5',borderRadius:8}]},options:opts});let s=document.getElementById('statusChart');if(s)new Chart(s,{type:'doughnut',data:{labels:['New','Preparing','Ready','Paid'],datasets:[{data:['new','preparing','ready','paid'].map(v=>db.orders.filter(o=>o.status===v).length),backgroundColor:['#8875f5','#efb95d','#45c9a1','#5794e8']}]},options:{plugins:{legend:{labels:{color:'#a9b6ce'}}}}})}
const fields={orders:[['customer','Customer','text'],['item','Item','text'],['amount','Amount','number'],['date','Date','date'],['status','Status','select:new|preparing|ready|paid']],menu:[['name','Dish name','text'],['category','Category','text'],['price','Price','number']],reservations:[['customer','Guest name','text'],['date','Date','date'],['time','Time','time'],['guests','Guests','number'],['status','Status','select:confirmed|cancelled|completed']],inventory:[['name','Ingredient','text'],['quantity','Quantity','number'],['unit','Unit','text'],['min','Minimum quantity','number']],customers:[['name','Customer name','text'],['email','Email','email'],['visits','Visits','number']],staff:[['name','Employee name','text'],['role','Role','text'],['shift','Shift','select:Morning|Evening|Night']],tables:[['seats','Seats','number'],['status','Status','select:available|occupied|reserved']]};
let editing=null;
function openAdd(){let k=page==='overview'||page==='analytics'||page==='settings'?'orders':page;openForm(k,null)}
function edit(k,id){openForm(k,db[k].find(x=>x.id===id))}
function openForm(k,obj){editing={k,id:obj?.id??null};document.getElementById('modalTitle').textContent=(obj?'Edit ':'Add ')+k.slice(0,-1);document.getElementById('entryForm').innerHTML=fields[k].map(([key,label,type])=>'<div class="field"><label for="f_'+key+'">'+label+'</label>'+(type.startsWith('select:')?'<select id="f_'+key+'" name="'+key+'">'+type.slice(7).split('|').map(v=>'<option '+(obj?.[key]===v?'selected':'')+'>'+v+'</option>').join('')+'</select>':'<input id="f_'+key+'" name="'+key+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(obj?.[key]??(type==='date'?new Date().toISOString().slice(0,10):''))+'" required>')+'</div>').join('')+'<button class="btn" type="submit">Save changes</button>';document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target),obj={};for(const [k,v] of fd)obj[k]=['amount','price','guests','quantity','min','visits','seats'].includes(k)?Number(v):String(v).trim();let {k,id}=editing;if(id!==null){Object.assign(db[k].find(x=>x.id===id),obj)}else db[k].push({id:Math.max(0,...db[k].map(x=>x.id))+1,...obj});save();closeModal();render();notify('Saved successfully')});
function remove(k,id){if(!confirm('Delete this record?'))return;db[k]=db[k].filter(x=>x.id!==id);save();render();notify('Record deleted')}
function changeStatus(k,id,v){db[k].find(x=>x.id===id).status=v;save();render();notify('Status updated')}
function saveSettings(e){e.preventDefault();db.settings=Object.fromEntries(new FormData(e.target));save();render();notify('Settings saved')}
function resetDemo(){if(confirm('Reset all local demo changes?')){db=structuredClone(seed);save();render();notify('Demo reset')}}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('restopilot-theme',document.body.classList.contains('light')?'light':'dark');render()}
function exportCSV(k){let data=db[k];if(!data.length)return notify('Nothing to export');let keys=Object.keys(data[0]),csv=[keys.join(','),...data.map(x=>keys.map(key=>'"'+String(x[key]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='restopilot-'+k+'.csv';a.click();URL.revokeObjectURL(a.href)}
if(localStorage.getItem('restopilot-theme')==='light')document.body.classList.add('light');render();
</script></body></html>
