<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="description" content="RestoPilot is a beautifully designed interactive restaurant management SaaS prototype. Explore orders, menus, reservations, analytics and more.">
  <meta property="og:title" content="RestoPilot — Restaurant Management, Beautifully Simplified">
  <meta property="og:description" content="An interactive restaurant management SaaS demo built with HTML, CSS & JavaScript.">
  <title>RestoPilot — Restaurant Management, Beautifully Simplified</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <div class="mobile-shade" id="mobileShade"></div>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="RestoPilot home">
        <span class="brand-mark"><i data-lucide="chef-hat"></i></span>
        <span>resto<span class="brand-accent">pilot.</span><small>RESTAURANT OS</small></span>
      </a>
      <div class="workspace">
        <div class="workspace-avatar"><i data-lucide="utensils-crossed"></i></div>
        <div class="workspace-text"><strong id="workspaceName">Atelier Bistro</strong><span>Premium workspace</span></div>
        <i data-lucide="chevrons-up-down" class="workspace-chevron"></i>
      </div>
      <div id="sideNav" class="sidebar-nav" aria-label="Main navigation"></div>
      <div class="sidebar-bottom">
        <div class="side-promo"><span class="promo-glow"><i data-lucide="sparkles"></i></span><strong>More than a dashboard.</strong><p>Run your restaurant with confidence. Everything, in one place.</p><button id="tourBtn" class="promo-btn">Explore features <i data-lucide="arrow-up-right"></i></button></div>
        <button class="user-profile" id="userProfile"><span class="profile-avatar">AL</span><span><strong>Alex Laurent</strong><small>Restaurant owner</small></span><i data-lucide="settings-2"></i></button>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open navigation"><i data-lucide="menu"></i></button>
          <div class="breadcrumbs"><span>Workspace</span><i data-lucide="chevron-right"></i><strong id="breadcrumb">Overview</strong></div>
        </div>
        <div class="topbar-right">
          <span class="demo-chip"><span></span> INTERACTIVE DEMO</span>
          <button class="icon-button" id="searchTrigger" aria-label="Search"><i data-lucide="search"></i></button>
          <button class="icon-button notification-button" id="notificationBtn" aria-label="Notifications"><i data-lucide="bell"></i><b></b></button>
          <button class="top-avatar" id="topAvatar" title="Profile and settings">AL</button>
        </div>
      </header>
      <main id="pageContent" tabindex="-1"></main>
      <footer class="app-footer"><span>© <span id="footerYear"></span> RestoPilot · Crafted for better hospitality</span><span>Prototype experience <span class="footer-dot">·</span> Built with HTML, CSS & JavaScript</span></footer>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
</body>
</html>
